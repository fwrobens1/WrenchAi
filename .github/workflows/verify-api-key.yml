name: verify-api-key

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: WRENCHAI_API_KEY
    steps:
      - name: Run a one-token completion with the environment secret
        env:
          REFLECTION_API_KEY: ${{ secrets.REFLECTION_API_KEY || secrets.WRENCHAI_API_KEY }}
          BASE_URL: ${{ vars.WRENCHAI_BASE_URL || 'https://api.reflection.ai/openai/v1' }}
          MODEL: ${{ vars.WRENCHAI_MODEL || 'Beam-1.0-501B-A23B' }}
        run: |
          set -euo pipefail

          if [ -z "${REFLECTION_API_KEY:-}" ]; then
            echo "::error::Set REFLECTION_API_KEY (or replace the WRENCHAI_API_KEY secret) with your Reflection key"
            exit 1
          fi
          echo "::add-mask::$REFLECTION_API_KEY"

          body=$(printf '{"model":"%s","messages":[{"role":"user","content":"ping"}],"max_tokens":5,"temperature":0}' "$MODEL")
          code=$(curl -sS -o /tmp/chat.json -w '%{http_code}' \
            -X POST "$BASE_URL/chat/completions" \
            -H "Authorization: Bearer $REFLECTION_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "POST $BASE_URL/chat/completions -> $code"

          if [ "$code" != "200" ]; then
            python3 - <<'EOF' || head -c 400 /tmp/chat.json
          import json
          data = json.load(open("/tmp/chat.json"))
          print(json.dumps(data.get("error", data))[:400])
          EOF
            echo "::error::The key or model was rejected (HTTP $code)"
            exit 1
          fi

          if grep -q '"choices"' /tmp/chat.json; then
            echo "Key is valid and $MODEL answered"
          else
            echo "::error::Response had no choices"
            head -c 400 /tmp/chat.json
            exit 1
          fi
